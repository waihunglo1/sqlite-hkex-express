[SQLITE]
FILE = data/hkex-market-breadth.db

[PATH]
US = C:/Users/user/Downloads/d_us_txt.zip
HK = C:/Users/user/Downloads/d_hk_txt.zip
EXTRACT = c:/Users/user/Downloads
dir1 = /data/daily/hk/hkex stocks
dir2 = /data/daily/hk/hkex etfs
dir3 = /data/daily/hk/hkex-quot

[HKEX]
ENABLE = true
URL = https://www.hkex.com.hk/chi/services/trading/securities/securitieslists/ListOfSecurities_c.xlsx
DOWNLOAD_PATH = temp
filePattern = d(\\d{6})e.htm
listOfSecurities = ListOfSecurities_c.xlsx

[YAHOO-FINANCE]
HISTORICAL_DATA_ENABLE = false

[GOOGLE-SPREADSHEET-01]
TAB_NAME=HKMBRAW
SQL=
    SELECT daily_market_stats.dt, up4pct1d, dn4pct1d, up25pctin100d, dn25pctin100d, 
        up25pctin20d, dn25pctin20d,  
        noofstocks, 
        above20smapct / 100, 
        above50smapct / 100, 
        above150smapct / 100, 
        above200smapct / 100, 
        hsi, hsce, 
        XLB_U4SM  / 100, XLC_U4SM  / 100, XLY_U4SM / 100,
        XLP_U4SM / 100, XLE_U4SM / 100, XLF_U4SM / 100,
        XLV_U4SM / 100, XLI_U4SM / 100, XLRE_U4SM / 100,
        XLK_U4SM / 100, XLU_U4SM / 100, XLX_U4SM / 100
    FROM daily_market_stats , DAILY_SECTORS_STATS
    where daily_market_stats.dt = DAILY_SECTORS_STATS.dt
    ORDER BY daily_market_stats.dt DESC   

[GOOGLE-SPREADSHEET-02]     
TAB_NAME=HKSTRAW
SQL=
    select 
        DAILY_STOCK_STATS.symbol,
        DAILY_STOCK_STATS.dt,
        DAILY_STOCK_STATS.start_dt,
        DAILY_STOCK_STATS.open,
        DAILY_STOCK_STATS.high,
        DAILY_STOCK_STATS.low,
        DAILY_STOCK_STATS.close,
        DAILY_STOCK_STATS.volume,
        DAILY_STOCK_STATS.prev_open,
        DAILY_STOCK_STATS.prev_high,
        DAILY_STOCK_STATS.prev_low,
        DAILY_STOCK_STATS.prev_close,
        DAILY_STOCK_STATS.prev_volume,
        DAILY_STOCK_STATS.roc020,
        DAILY_STOCK_STATS.roc125,
        DAILY_STOCK_STATS.rsi014,
        DAILY_STOCK_STATS.sma200,
        DAILY_STOCK_STATS.sma150,
        DAILY_STOCK_STATS.sma100,
        DAILY_STOCK_STATS.sma050,
        DAILY_STOCK_STATS.sma020,
        DAILY_STOCK_STATS.sma010,
        DAILY_STOCK_STATS.sma005,
        DAILY_STOCK_STATS.sma003,
        DAILY_STOCK_STATS.ema050,
        DAILY_STOCK_STATS.ema200,
        DAILY_STOCK_STATS.ema200pref,
        DAILY_STOCK_STATS.sma200pref,
        DAILY_STOCK_STATS.ema500pref,
        DAILY_STOCK_STATS.sma50pref,
        DAILY_STOCK_STATS.rsi14sctr,
        DAILY_STOCK_STATS.ppo01sctr,
        DAILY_STOCK_STATS.roc125sctr,
        DAILY_STOCK_STATS.sctr,
        DAILY_STOCK_STATS.histDay,
        DAILY_STOCK_STATS.chg_pct_1d,
        DAILY_STOCK_STATS.chg_pct_5d,
        DAILY_STOCK_STATS.chg_pct_10d,
        DAILY_STOCK_STATS.chg_pct_20d,
        DAILY_STOCK_STATS.chg_pct_50d,
        DAILY_STOCK_STATS.chg_pct_100d,
        DAILY_STOCK_STATS.sma10turnover,
        DAILY_STOCK_STATS.sma20turnover,
        DAILY_STOCK_STATS.sma50turnover,
        DAILY_STOCK_STATS.above_200d_sma,
        DAILY_STOCK_STATS.above_150d_sma,
        DAILY_STOCK_STATS.above_100d_sma,
        DAILY_STOCK_STATS.above_50d_sma,
        DAILY_STOCK_STATS.above_20d_sma,
        DAILY_STOCK_STATS.above_10d_sma,
        DAILY_STOCK_STATS.above_5d_sma,
        DAILY_STOCK_STATS.vp_high,
        DAILY_STOCK_STATS.vp_low,
        DAILY_STOCK_STATS.vp_bullish,
        DAILY_STOCK_STATS.vp_bearish,
        DAILY_STOCK_STATS.rs,
        DAILY_STOCK_STATS.normalise_rs,
        DAILY_STOCK_STATS.rs_priceOverSMA20,
        DAILY_STOCK_STATS.rs_slopeSMA20,
        DAILY_STOCK_STATS.rs_slopeSMA50,
        DAILY_STOCK_STATS.rs_slopeSMA150,
        STOCK.sector, 
        STOCK.industry, 
        substr(STOCK.name,0,100) as short_name 
    from DAILY_STOCK_STATS, STOCK
        where DAILY_STOCK_STATS.symbol = STOCK.symbol
        and dt in (
            select dt from DAILY_STOCK_STATS
            group by dt
            order by dt DESC
            limit 1
        )
        order by dt DESC